<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOKTA WhatsApp Bağlantısı</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 500px;
      max-width: calc(100% - 30px);

      padding: 45px;
      border: 1px solid #b88a32;
      border-radius: 18px;

      background: #111;
      text-align: center;
    }

    h1 {
      color: #d4af55;
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 25px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 17px;

      margin-top: 25px;

      border: 0;
      border-radius: 10px;

      background: #d4af55;
      color: #080808;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;
      line-height: 1.6;
      font-size: 14px;
    }

    .success {
      color: #5ee173;
    }

    .error {
      color: #ff6565;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>NOKTA</h1>

  <h2>WhatsApp Business</h2>

  <p>
    Nokta WhatsApp Business hesabını
    Nokta Cari sistemine bağla.
  </p>

  <button onclick="launchWhatsAppSignup()">
    WhatsApp Business'ı Bağla
  </button>

  <div id="status">
    Facebook SDK yükleniyor...
  </div>

</div>


<script>

  /*
   * NOKTA WHATSAPP EMBEDDED SIGNUP
   */

  const APP_ID = "1406505614384928";

  /*
   * Meta Embedded Signup ekranının
   * verdiği Configuration ID
   */
  const CONFIG_ID = "1388583019481771";


  let authorizationCode = null;
  let wabaId = null;
  let phoneNumberId = null;


  /*
   * --------------------------------------------------
   * FACEBOOK SDK
   * --------------------------------------------------
   */

  window.fbAsyncInit = function () {

    FB.init({
      appId: APP_ID,
      autoLogAppEvents: true,
      xfbml: true,
      version: "v26.0"
    });

    console.log("Facebook SDK v26.0 hazır.");

    document.getElementById("status").innerText =
      "Bağlantıya hazır.";

  };


  /*
   * Facebook SDK yükle
   */

  (function (d, s, id) {

    let js;
    const fjs = d.getElementsByTagName(s)[0];

    if (d.getElementById(id)) {
      return;
    }

    js = d.createElement(s);

    js.id = id;

    js.src =
      "https://connect.facebook.net/en_US/sdk.js";

    js.async = true;
    js.defer = true;
    js.crossOrigin = "anonymous";

    fjs.parentNode.insertBefore(js, fjs);

  }(
    document,
    "script",
    "facebook-jssdk"
  ));


  /*
   * --------------------------------------------------
   * META SESSION INFO
   * --------------------------------------------------
   *
   * Meta'nın verdiği WA_EMBEDDED_SIGNUP
   * mesajını burada yakalıyoruz.
   */

  window.addEventListener(
    "message",
    function (event) {

      /*
       * Sadece Facebook mesajlarını kabul et.
       */

      if (
        event.origin !== "https://www.facebook.com" &&
        event.origin !== "https://web.facebook.com"
      ) {
        return;
      }


      let data;

      try {

        /*
         * Meta bazen JSON string,
         * bazen object gönderebilir.
         */

        if (typeof event.data === "string") {

          data = JSON.parse(event.data);

        } else {

          data = event.data;

        }

      } catch (error) {

        /*
         * xd_arbiter gibi Facebook'un kendi
         * RAW mesajlarını sessizce geçiyoruz.
         *
         * Bunlar WA session mesajı değildir.
         */

        return;

      }


      /*
       * Sadece WhatsApp Embedded Signup
       * mesajıyla ilgileniyoruz.
       */

      if (
        !data ||
        data.type !== "WA_EMBEDDED_SIGNUP"
      ) {
        return;
      }


      console.log(
        "WA_EMBEDDED_SIGNUP:",
        data
      );


      /*
       * --------------------------------------
       * FINISH
       * --------------------------------------
       */

      if (data.event === "FINISH") {

        wabaId =
          data.data?.waba_id || null;

        phoneNumberId =
          data.data?.phone_number_id || null;


        console.log(
          "WABA ID:",
          wabaId
        );

        console.log(
          "PHONE NUMBER ID:",
          phoneNumberId
        );


        updateStatus();

      }


      /*
       * --------------------------------------
       * CANCEL
       * --------------------------------------
       */

      else if (data.event === "CANCEL") {

        console.warn(
          "Embedded Signup iptal edildi:",
          data
        );

        document.getElementById("status").innerHTML =
          '<span class="error">' +
          'WhatsApp bağlantısı iptal edildi.' +
          '</span>';

      }


      /*
       * --------------------------------------
       * ERROR
       * --------------------------------------
       */

      else if (data.event === "ERROR") {

        console.error(
          "Embedded Signup hata:",
          data
        );

        document.getElementById("status").innerHTML =
          '<span class="error">' +
          'WhatsApp bağlantısında hata oluştu.' +
          '</span>';

      }

    }
  );


  /*
   * --------------------------------------------------
   * FACEBOOK LOGIN CALLBACK
   * --------------------------------------------------
   */

  function fbLoginCallback(response) {

    console.log(
      "LOGIN CALLBACK:",
      response
    );


    if (
      response &&
      response.authResponse &&
      response.authResponse.code
    ) {

      authorizationCode =
        response.authResponse.code;


      /*
       * Authorization Code'u TAM OLARAK
       * console'a basmıyoruz.
       *
       * Daha sonra backend'e gönderilecek.
       */

      console.log(
        "Authorization Code: ALINDI"
      );


      updateStatus();

    } else {

      console.error(
        "Authorization Code alınamadı.",
        response
      );

      document.getElementById("status").innerHTML =
        '<span class="error">' +
        'Meta yetkilendirmesi tamamlanamadı.' +
        '</span>';

    }

  }


  /*
   * --------------------------------------------------
   * EMBEDDED SIGNUP BAŞLAT
   * --------------------------------------------------
   */

  function launchWhatsAppSignup() {

    authorizationCode = null;
    wabaId = null;
    phoneNumberId = null;


    document.getElementById("status").innerText =
      "Meta açılıyor...";


    console.log(
      "Embedded Signup v4 başlatılıyor..."
    );


    FB.login(
      fbLoginCallback,
      {

        /*
         * Meta'nın Embedded Signup
         * ekranında verdiği Configuration
         */

        config_id: CONFIG_ID,

        /*
         * System User token akışı için
         * Meta bunu istiyor.
         */

        response_type: "code",

        override_default_response_type: true,

        /*
         * Meta'nın bize verdiği güncel
         * Embedded Signup ayarı.
         */

        extras: {
          version: "v4"
        }

      }
    );

  }


  /*
   * --------------------------------------------------
   * DURUM GÖSTER
   * --------------------------------------------------
   */

  function updateStatus() {

    console.log(
      "----- INTEGRATION DURUMU -----"
    );

    console.log(
      "Authorization Code:",
      authorizationCode
        ? "ALINDI"
        : "BEKLENİYOR"
    );

    console.log(
      "WABA ID:",
      wabaId || "BEKLENİYOR"
    );

    console.log(
      "Phone Number ID:",
      phoneNumberId || "BEKLENİYOR"
    );


    /*
     * Her şey geldiyse
     */

    if (
      authorizationCode &&
      wabaId &&
      phoneNumberId
    ) {

      document.getElementById("status").innerHTML =

        '<span class="success">' +

        '✓ WhatsApp bağlantısı tamamlandı.<br><br>' +

        'WABA ID: ' +
        escapeHtml(wabaId) +

        '<br>' +

        'Phone Number ID: ' +
        escapeHtml(phoneNumberId) +

        '</span>';


      console.log(
        "WHATSAPP BAĞLANTISI TAMAMLANDI"
      );

      console.log({
        wabaId,
        phoneNumberId
      });

      /*
       * SONRAKİ AŞAMA:
       *
       * authorizationCode
       * wabaId
       * phoneNumberId
       *
       * backend'e gönderilecek.
       */

      return;

    }


    /*
     * Code geldi ama session info
     * henüz gelmediyse
     */

    if (
      authorizationCode &&
      (!wabaId || !phoneNumberId)
    ) {

      document.getElementById("status").innerText =
        "Meta yetkilendirmesi alındı. " +
        "WhatsApp hesap bilgileri bekleniyor...";

      return;

    }


    /*
     * Session info önce gelirse
     */

    if (
      wabaId &&
      phoneNumberId &&
      !authorizationCode
    ) {

      document.getElementById("status").innerText =
        "WhatsApp hesap bilgileri alındı. " +
        "Yetkilendirme kodu bekleniyor...";

    }

  }


  /*
   * Basit HTML escape
   */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
