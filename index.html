<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOKTA WhatsApp Bağlantısı</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 480px;
      max-width: calc(100% - 30px);
      padding: 45px;
      text-align: center;
      background: #111111;
      border: 1px solid #c69a3b;
      border-radius: 20px;
    }

    h1 {
      margin: 0 0 25px;
      color: #d4af55;
      font-size: 38px;
      letter-spacing: 7px;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 25px;
    }

    p {
      color: #aaaaaa;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: 0;
      border-radius: 10px;
      background: #d4af55;
      color: #080808;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.7;
    }

    .success {
      color: #66d879;
    }

    .error {
      color: #ff6969;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>NOKTA</h1>

    <h2>WhatsApp Business</h2>

    <p>
      Nokta WhatsApp Business hesabını
      Nokta Cari sistemine bağla.
    </p>

    <button onclick="launchWhatsAppSignup()">
      WhatsApp Business'ı Bağla
    </button>

    <div id="status">
      Meta SDK yükleniyor...
    </div>

  </div>


  <script>

    /* ==========================================
       META BİLGİLERİ
       ========================================== */

    const APP_ID = "1406505614384928";
    const CONFIG_ID = "1388583019481771";


    /* ==========================================
       META'NIN VERDİĞİ SDK v26.0
       ========================================== */

    window.fbAsyncInit = function() {

      FB.init({
        appId: APP_ID,
        autoLogAppEvents: true,
        xfbml: true,
        version: "v26.0"
      });

      console.log("Facebook SDK v26.0 hazır.");

      document.getElementById("status").innerText =
        "Meta bağlantısı hazır.";
    };


    /* ==========================================
       SESSION INFO LISTENER
       Meta Embedded Signup postMessage
       ========================================== */

    window.addEventListener("message", (event) => {

      if (event.origin !== "https://www.facebook.com") {
        return;
      }

      console.log("FACEBOOK RAW MESSAGE:", event.data);

      try {

        const data = JSON.parse(event.data);

        console.log("FACEBOOK PARSED MESSAGE:", data);

        if (data.type !== "WA_EMBEDDED_SIGNUP") {
          return;
        }

        console.log("WA_EMBEDDED_SIGNUP:", data);


        /* ---------- BAŞARILI ---------- */

        if (data.event === "FINISH") {

          const wabaId =
            data.data && data.data.waba_id;

          const phoneNumberId =
            data.data && data.data.phone_number_id;


          console.log(
            "Embedded Signup FINISH alındı."
          );

          console.log(
            "WABA ID:",
            wabaId
          );

          console.log(
            "PHONE NUMBER ID:",
            phoneNumberId
          );


          document.getElementById("status").innerHTML =
            '<span class="success">' +
            '<strong>WHATSAPP BAĞLANTISI TAMAMLANDI ✅</strong>' +
            '<br><br>' +
            'WABA ID: ' + (wabaId || "-") +
            '<br>' +
            'Phone Number ID: ' + (phoneNumberId || "-") +
            '</span>';
        }


        /* ---------- İPTAL ---------- */

        else if (data.event === "CANCEL") {

          console.log(
            "Embedded Signup CANCEL:",
            data
          );

          document.getElementById("status").innerHTML =
            '<span class="error">' +
            'WhatsApp bağlantısı iptal edildi.' +
            '</span>';
        }


        /* ---------- HATA ---------- */

        else if (data.event === "ERROR") {

          console.error(
            "Embedded Signup ERROR:",
            data
          );

          document.getElementById("status").innerHTML =
            '<span class="error">' +
            'WhatsApp Embedded Signup hatası oluştu.' +
            '</span>';
        }

      }

      catch (error) {

        /*
          OAuth popup mesajları JSON olmayabilir.
          Bunları sadece debug için gösteriyoruz.
        */

        console.log(
          "Facebook mesajı WA session JSON değildi."
        );
      }

    });


    /* ==========================================
       META LOGIN CALLBACK
       ========================================== */

    const fbLoginCallback = (response) => {

      console.log(
        "LOGIN CALLBACK:",
        response
      );


      if (
        response &&
        response.authResponse &&
        response.authResponse.code
      ) {

        /*
          Authorization Code'u bilerek
          Console'a yazmıyoruz.
        */

        console.log(
          "Authorization Code başarıyla alındı."
        );


        document.getElementById("status").innerText =
          "Meta yetkilendirmesi tamamlandı. " +
          "WhatsApp kurulum sonucu bekleniyor...";

      }

      else {

        console.error(
          "Meta yetkilendirmesi tamamlanamadı.",
          response
        );

        document.getElementById("status").innerHTML =
          '<span class="error">' +
          'Meta yetkilendirmesi tamamlanamadı.' +
          '</span>';
      }

    };


    /* ==========================================
       META'NIN VERDİĞİ EMBEDDED SIGNUP v4
       ========================================== */

    const launchWhatsAppSignup = () => {

      if (typeof FB === "undefined") {

        document.getElementById("status").innerHTML =
          '<span class="error">' +
          'Meta SDK henüz yüklenmedi. ' +
          'Birkaç saniye sonra tekrar deneyin.' +
          '</span>';

        return;
      }


      console.log(
        "Embedded Signup v4 başlatılıyor..."
      );


      document.getElementById("status").innerText =
        "Meta WhatsApp kurulumu açılıyor...";


      FB.login(
        fbLoginCallback,
        {

          config_id: CONFIG_ID,

          response_type: "code",

          override_default_response_type: true,

          extras: {
            "version": "v4"
          }

        }
      );

    };

  </script>


  <!-- META'NIN VERDİĞİ SDK YÜKLEME KODU -->

  <script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js">
  </script>

</body>
</html>
