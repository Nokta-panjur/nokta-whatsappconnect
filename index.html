<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOKTA WhatsApp Bağlantısı</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
    }

    .card {
      width: 500px;
      max-width: calc(100% - 30px);

      padding: 45px;

      border: 1px solid #b88a32;
      border-radius: 18px;

      background: #111;
      text-align: center;
    }

    h1 {
      margin-top: 0;

      color: #d4af55;

      letter-spacing: 6px;
      font-size: 36px;
    }

    h2 {
      color: #ffffff;
      font-size: 26px;
    }

    p {
      color: #aaa;

      line-height: 1.6;
      font-size: 16px;
    }

    button {
      width: 100%;

      padding: 17px;

      margin-top: 20px;

      border: 0;
      border-radius: 10px;

      background: #d4af55;
      color: #080808;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;

      font-size: 14px;
      line-height: 1.7;

      color: #ffffff;
    }

    .success {
      color: #62d26f;
    }

    .error {
      color: #ff6262;
    }
  </style>
</head>


<body>

<div class="card">

  <h1>NOKTA</h1>

  <h2>WhatsApp Business</h2>

  <p>
    Nokta WhatsApp Business hesabını
    Nokta Cari sistemine bağla.
  </p>

  <button onclick="launchWhatsAppSignup()">
    WhatsApp Business'ı Bağla
  </button>

  <div id="status">
    Bağlantı bekleniyor.
  </div>

</div>


<script>

  /* =====================================================
     NOKTA META BİLGİLERİ
     ===================================================== */

  const APP_ID = "1406505614384928";

  const CONFIG_ID = "1388583019481771";


  /* =====================================================
     FACEBOOK JAVASCRIPT SDK
     ===================================================== */

  window.fbAsyncInit = function() {

    FB.init({

      appId: APP_ID,

      cookie: true,

      xfbml: true,

      version: "v25.0",

      status: false

    });


    console.log("Facebook SDK hazır.");


    document.getElementById("status").innerText =
      "Meta bağlantısı hazır.";

  };


  /* =====================================================
     FACEBOOK SDK YÜKLE
     ===================================================== */

  (function(d, s, id) {

    var js;

    var fjs =
      d.getElementsByTagName(s)[0];


    if (d.getElementById(id)) {

      return;

    }


    js =
      d.createElement(s);


    js.id =
      id;


    js.src =
      "https://connect.facebook.net/en_US/sdk.js";


    fjs.parentNode.insertBefore(
      js,
      fjs
    );


  }(
    document,
    "script",
    "facebook-jssdk"
  ));



  /* =====================================================
     WHATSAPP EMBEDDED SIGNUP
     SESSION INFO LISTENER

     META'NIN GÜNCEL POSTMESSAGE YAPISI
     ===================================================== */

  window.addEventListener(
    "message",
    (event) => {


      /* Sadece Facebook'tan gelen mesaj */

      if (
        event.origin !==
        "https://www.facebook.com"
      ) {

        return;

      }


      /*
        TEST İÇİN GELEN MESAJIN
        TAMAMINI GÖSTER
      */

      console.log(
        "FACEBOOK RAW MESSAGE:",
        event.data
      );


      try {


        /*
          Meta'nın dökümanındaki gibi
          JSON string'i parse ediyoruz.
        */

        const data =
          JSON.parse(event.data);


        console.log(
          "FACEBOOK PARSED MESSAGE:",
          data
        );


        /* ===============================================
           WHATSAPP EMBEDDED SIGNUP MESAJI
           =============================================== */

        if (
          data.type ===
          "WA_EMBEDDED_SIGNUP"
        ) {


          console.log(
            "WA_EMBEDDED_SIGNUP GELDİ:",
            data
          );


          /* =============================================
             BAŞARILI
             ============================================= */

          if (
            data.event ===
            "FINISH"
          ) {


            const phoneNumberId =
              data.data &&
              data.data.phone_number_id;


            const wabaId =
              data.data &&
              data.data.waba_id;


            console.log(
              "PHONE NUMBER ID:",
              phoneNumberId
            );


            console.log(
              "WABA ID:",
              wabaId
            );


            document.getElementById(
              "status"
            ).innerHTML =

              '<span class="success">' +

              "<strong>" +

              "WHATSAPP BAĞLANTISI TAMAMLANDI ✅" +

              "</strong>" +

              "<br><br>" +

              "Phone Number ID: " +

              (phoneNumberId || "-") +

              "<br>" +

              "WABA ID: " +

              (wabaId || "-") +

              "</span>";

          }


          /* =============================================
             İPTAL EDİLDİ
             ============================================= */

          else if (
            data.event ===
            "CANCEL"
          ) {


            console.log(
              "KULLANICI İPTAL ETTİ:",
              data
            );


            document.getElementById(
              "status"
            ).innerHTML =

              '<span class="error">' +

              "WhatsApp bağlantısı iptal edildi." +

              "</span>";

          }


          /* =============================================
             HATA
             ============================================= */

          else if (
            data.event ===
            "ERROR"
          ) {


            console.error(
              "WHATSAPP SIGNUP ERROR:",
              data
            );


            document.getElementById(
              "status"
            ).innerHTML =

              '<span class="error">' +

              "WhatsApp Embedded Signup hatası oluştu." +

              "</span>";

          }

        }


      } catch (error) {


        /*
          Facebook başka tipte mesaj
          gönderirse burada göreceğiz.
        */

        console.log(
          "Facebook mesajı JSON değildi:",
          event.data
        );

      }

    }
  );



  /* =====================================================
     FACEBOOK LOGIN CALLBACK
     ===================================================== */

  function fbLoginCallback(
    response
  ) {


    console.log(
      "Login response:",
      response
    );


    if (
      response &&
      response.authResponse
    ) {


      const code =
        response.authResponse.code;


      /*
        CODE'U CONSOLE'A YAZMIYORUZ.

        Bu değer daha sonra backend'e
        gönderilecek ve access token'a
        çevrilecek.
      */


      console.log(
        "Authorization Code başarıyla alındı."
      );


      document.getElementById(
        "status"
      ).innerText =

        "Meta yetkilendirmesi alındı. " +

        "WhatsApp hesap bilgileri bekleniyor...";


    }


    else {


      console.log(
        "Yetkilendirme tamamlanmadı:",
        response
      );


      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="error">' +

        "Meta yetkilendirmesi tamamlanmadı." +

        "</span>";

    }

  }



  /* =====================================================
     WHATSAPP EMBEDDED SIGNUP BAŞLAT

     META'NIN SENİN CONFIG ID İÇİN
     VERDİĞİ GÜNCEL v4 YAPISI
     ===================================================== */

  function launchWhatsAppSignup() {


    document.getElementById(
      "status"
    ).innerText =
      "Meta açılıyor...";


    console.log(
      "WhatsApp Embedded Signup başlatılıyor..."
    );


    FB.login(

      fbLoginCallback,

      {

        config_id:
          CONFIG_ID,

        response_type:
          "code",

        override_default_response_type:
          true,

        extras: {
          "version": "v4"
        }

      }

    );

  }

</script>

</body>
</html>
