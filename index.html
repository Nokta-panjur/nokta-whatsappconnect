<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOKTA WhatsApp Coexistence</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 500px;
      max-width: calc(100% - 30px);

      padding: 45px;

      background: #111111;

      border: 1px solid #b88a32;
      border-radius: 18px;

      text-align: center;
    }

    h1 {
      margin: 0 0 25px;

      color: #d4af55;

      font-size: 38px;
      letter-spacing: 6px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 26px;
    }

    p {
      color: #aaaaaa;
      line-height: 1.6;
      font-size: 16px;
    }

    button {
      width: 100%;

      margin-top: 25px;
      padding: 17px;

      border: 0;
      border-radius: 10px;

      background: #d4af55;
      color: #080808;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;

      font-size: 14px;
      line-height: 1.7;
    }

    .success {
      color: #61dc78;
    }

    .error {
      color: #ff6666;
    }

    .waiting {
      color: #d4af55;
    }
  </style>
</head>


<body>

<div class="card">

  <h1>NOKTA</h1>

  <h2>WhatsApp Business Coexistence</h2>

  <p>
    Mevcut Nokta WhatsApp Business hesabını
    Nokta Cari sistemine bağla.
  </p>

  <button onclick="launchWhatsAppSignup()">
    WhatsApp Business'ı Bağla
  </button>

  <div id="status">
    Meta SDK yükleniyor...
  </div>

</div>


<script>

  /* ==================================================
     NOKTA META AYARLARI
  ================================================== */

  const APP_ID =
    "1406505614384928";

  const CONFIG_ID =
    "1388583019481771";


  let authorizationCode = null;

  let wabaId = null;

  let phoneNumberId = null;


  /* ==================================================
     FACEBOOK SDK
  ================================================== */

  window.fbAsyncInit = function () {

    FB.init({

      appId: APP_ID,

      autoLogAppEvents: true,

      xfbml: true,

      version: "v26.0"

    });


    console.log(
      "Facebook SDK v26.0 hazır."
    );


    document.getElementById(
      "status"
    ).innerHTML =

      '<span class="success">' +

      'Meta bağlantısı hazır.' +

      '</span>';

  };


  /* ==================================================
     FACEBOOK SDK YÜKLE
  ================================================== */

  (function (d, s, id) {

    let js;

    const fjs =
      d.getElementsByTagName(s)[0];


    if (
      d.getElementById(id)
    ) {

      return;

    }


    js =
      d.createElement(s);


    js.id =
      id;


    js.src =
      "https://connect.facebook.net/en_US/sdk.js";


    js.async =
      true;


    js.defer =
      true;


    js.crossOrigin =
      "anonymous";


    fjs.parentNode.insertBefore(
      js,
      fjs
    );


  }(
    document,
    "script",
    "facebook-jssdk"
  ));


  /* ==================================================
     WHATSAPP SESSION INFO LISTENER
  ================================================== */

  window.addEventListener(
    "message",
    function (event) {


      if (
        event.origin !== "https://www.facebook.com" &&
        event.origin !== "https://web.facebook.com"
      ) {

        return;

      }


      let data;


      try {


        if (
          typeof event.data === "string"
        ) {

          data =
            JSON.parse(event.data);

        }

        else {

          data =
            event.data;

        }


      }

      catch (error) {

        /*
          Facebook OAuth kendi RAW mesajlarını
          gönderebilir.

          cb=...
          code=...
          frame=...

          Bunlar WhatsApp session mesajı değil.
        */

        return;

      }


      if (
        !data ||
        data.type !== "WA_EMBEDDED_SIGNUP"
      ) {

        return;

      }


      console.log(
        "================================"
      );

      console.log(
        "WA_EMBEDDED_SIGNUP GELDİ"
      );

      console.log(
        data
      );

      console.log(
        "================================"
      );


      /*
       * STANDART EMBEDDED SIGNUP FINISH
       */

      if (
        data.event === "FINISH"
      ) {

        console.log(
          "Standart FINISH eventi geldi."
        );


        readWhatsAppIds(data);

      }


      /*
       * COEXISTENCE / WHATSAPP BUSINESS APP
       * ONBOARDING FINISH
       */

      else if (
        data.event ===
        "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING"
      ) {

        console.log(
          "COEXISTENCE FINISH eventi geldi."
        );


        readWhatsAppIds(data);

      }


      /*
       * CANCEL
       */

      else if (
        data.event === "CANCEL"
      ) {

        console.warn(
          "WhatsApp onboarding iptal edildi.",
          data
        );


        document.getElementById(
          "status"
        ).innerHTML =

          '<span class="error">' +

          'WhatsApp bağlantısı iptal edildi.' +

          '</span>';

      }


      /*
       * ERROR
       */

      else if (
        data.event === "ERROR"
      ) {

        console.error(
          "WhatsApp onboarding hatası:",
          data
        );


        document.getElementById(
          "status"
        ).innerHTML =

          '<span class="error">' +

          'WhatsApp bağlantısında hata oluştu.' +

          '</span>';

      }


      /*
       * BİLMEDİĞİMİZ EVENT
       *
       * Coexistence event yapısını görmek
       * için console'a basıyoruz.
       */

      else {

        console.log(
          "WhatsApp event:",
          data.event
        );

        console.log(
          "WhatsApp event data:",
          data.data
        );

      }

    }
  );


  /* ==================================================
     WABA + PHONE ID OKU
  ================================================== */

  function readWhatsAppIds(data) {


    const sessionData =
      data && data.data
        ? data.data
        : {};


    /*
      Farklı response yapıları ihtimaline
      karşı birkaç alanı kontrol ediyoruz.
    */

    wabaId =

      sessionData.waba_id ||

      sessionData.wabaId ||

      sessionData.whatsapp_business_account_id ||

      null;


    phoneNumberId =

      sessionData.phone_number_id ||

      sessionData.phoneNumberId ||

      null;


    console.log(
      "WABA ID:",
      wabaId || "Henüz gelmedi"
    );


    console.log(
      "PHONE NUMBER ID:",
      phoneNumberId || "Henüz gelmedi"
    );


    updateStatus();

  }


  /* ==================================================
     LOGIN CALLBACK
  ================================================== */

  function fbLoginCallback(
    response
  ) {


    console.log(
      "LOGIN CALLBACK:",
      response
    );


    if (
      response &&
      response.authResponse &&
      response.authResponse.code
    ) {


      authorizationCode =
        response.authResponse.code;


      /*
        Güvenlik için gerçek authorization
        code'u Console'a yazdırmıyoruz.
      */

      console.log(
        "Authorization Code: ALINDI"
      );


      updateStatus();

    }


    else {


      console.error(
        "Meta authorization başarısız:",
        response
      );


      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="error">' +

        'Meta yetkilendirmesi tamamlanamadı.' +

        '</span>';

    }

  }


  /* ==================================================
     COEXISTENCE EMBEDDED SIGNUP BAŞLAT
  ================================================== */

  function launchWhatsAppSignup() {


    if (
      typeof FB === "undefined"
    ) {


      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="error">' +

        'Meta SDK henüz hazır değil.' +

        '</span>';


      return;

    }


    authorizationCode =
      null;

    wabaId =
      null;

    phoneNumberId =
      null;


    console.log(
      "WhatsApp Business App Coexistence başlatılıyor..."
    );


    document.getElementById(
      "status"
    ).innerHTML =

      '<span class="waiting">' +

      'WhatsApp Business bağlantısı açılıyor...' +

      '</span>';


    FB.login(

      fbLoginCallback,

      {

        config_id:
          CONFIG_ID,

        response_type:
          "code",

        override_default_response_type:
          true,


        /*
         * KRİTİK KISIM
         *
         * Standart Embedded Signup yerine
         * WhatsApp Business App onboarding /
         * Coexistence akışını istiyoruz.
         */

        extras: {

          version:
            "v4",

          featureType:
            "whatsapp_business_app_onboarding"

        }

      }

    );

  }


  /* ==================================================
     DURUM
  ================================================== */

  function updateStatus() {


    console.log(
      "----- NOKTA WHATSAPP DURUMU -----"
    );


    console.log(
      "Authorization Code:",
      authorizationCode
        ? "ALINDI"
        : "BEKLENİYOR"
    );


    console.log(
      "WABA ID:",
      wabaId || "BEKLENİYOR"
    );


    console.log(
      "Phone Number ID:",
      phoneNumberId || "BEKLENİYOR"
    );


    /*
       HER ŞEY TAMAM
    */

    if (
      authorizationCode &&
      wabaId &&
      phoneNumberId
    ) {


      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="success">' +

        '<strong>' +

        '✓ WHATSAPP BAĞLANTISI TAMAMLANDI' +

        '</strong>' +

        '<br><br>' +

        'WABA ID: ' +

        escapeHtml(wabaId) +

        '<br>' +

        'Phone Number ID: ' +

        escapeHtml(phoneNumberId) +

        '<br><br>' +

        'Nokta Cari backend bağlantısına hazır.' +

        '</span>';


      console.log(
        "================================"
      );

      console.log(
        "NOKTA WHATSAPP BAĞLANTISI TAMAMLANDI"
      );

      console.log(
        "================================"
      );


      return;

    }


    /*
       AUTH CODE GELDİ
    */

    if (
      authorizationCode &&
      !wabaId &&
      !phoneNumberId
    ) {


      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="waiting">' +

        'Meta yetkilendirmesi alındı.<br>' +

        'WhatsApp Business App onboarding sonucu bekleniyor...' +

        '</span>';


      return;

    }


    /*
       SESSION INFO ÖNCE GELDİ
    */

    if (
      wabaId &&
      !authorizationCode
    ) {


      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="waiting">' +

        'WhatsApp hesap bilgileri alındı.<br>' +

        'Meta yetkilendirmesi bekleniyor...' +

        '</span>';

    }

  }


  /* ==================================================
     HTML ESCAPE
  ================================================== */

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }

</script>


</body>
</html>
