<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOKTA WhatsApp Bağlantısı</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
    }

    .card {
      width: 500px;
      max-width: calc(100% - 30px);

      padding: 45px;

      border: 1px solid #b88a32;
      border-radius: 18px;

      background: #111;

      text-align: center;
    }

    h1 {
      color: #d4af55;
      letter-spacing: 5px;
      font-size: 38px;
      margin-top: 0;
    }

    h2 {
      font-size: 27px;
      margin-top: 25px;
    }

    p {
      color: #aaa;
      line-height: 1.6;
      font-size: 17px;
    }

    button {
      width: 100%;

      padding: 17px;
      margin-top: 25px;

      border: 0;
      border-radius: 10px;

      background: #d4af55;
      color: #080808;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 25px;
      font-size: 15px;
      line-height: 1.6;
    }

    .success {
      color: #5cff85;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>


<body>

<div class="card">

  <h1>NOKTA</h1>

  <h2>WhatsApp Business</h2>

  <p>
    Nokta WhatsApp Business hesabını
    Nokta Cari sistemine bağla.
  </p>

  <button onclick="launchWhatsAppSignup()">
    WhatsApp Business'ı Bağla
  </button>

  <div id="status">
    Facebook SDK yükleniyor...
  </div>

</div>


<!-- FACEBOOK SDK -->

<script>

const APP_ID = "1406505614384928";
const CONFIG_ID = "1388583019481771";

let authorizationCode = null;
let wabaId = null;
let phoneNumberId = null;


/* =====================================================
   FACEBOOK SDK
===================================================== */

window.fbAsyncInit = function() {

  FB.init({
    appId: APP_ID,
    autoLogAppEvents: true,
    xfbml: true,
    version: "v26.0"
  });

  console.log("Facebook SDK v26.0 hazır.");

  document.getElementById("status").innerText =
    "Meta bağlantısı hazır.";

};


/* =====================================================
   EMBEDDED SIGNUP SESSION INFO
===================================================== */

window.addEventListener("message", function(event) {

  /*
    Meta dokümanındaki WA Embedded Signup
    mesajlarını dinliyoruz.
  */

  if (event.origin !== "https://www.facebook.com") {
    return;
  }


  try {

    const data =
      typeof event.data === "string"
        ? JSON.parse(event.data)
        : event.data;


    if (!data || data.type !== "WA_EMBEDDED_SIGNUP") {
      return;
    }


    console.log("=================================");
    console.log("WA_EMBEDDED_SIGNUP MESAJI GELDİ");
    console.log("=================================");

    console.log("Tüm veri:", data);
    console.log("Event:", data.event);
    console.log("Data:", data.data);


    /* ===============================
       FINISH
    =============================== */

    if (data.event === "FINISH") {

      wabaId =
        data.data &&
        data.data.waba_id
          ? data.data.waba_id
          : null;


      phoneNumberId =
        data.data &&
        data.data.phone_number_id
          ? data.data.phone_number_id
          : null;


      console.log("FINISH geldi.");

      console.log(
        "WABA ID:",
        wabaId
      );

      console.log(
        "PHONE NUMBER ID:",
        phoneNumberId
      );


      document.getElementById("status").innerHTML =

        '<span class="success">' +

        "WhatsApp bağlantısı tamamlandı." +

        "<br><br>" +

        "WABA ID: " +
        (wabaId || "bulunamadı") +

        "<br>" +

        "Phone Number ID: " +
        (phoneNumberId || "bulunamadı") +

        "</span>";


      checkIntegrationData();

    }


    /* ===============================
       CANCEL
    =============================== */

    else if (data.event === "CANCEL") {

      console.warn(
        "Embedded Signup iptal edildi:",
        data
      );


      document.getElementById("status").innerHTML =

        '<span class="error">' +

        "WhatsApp bağlantısı iptal edildi." +

        "</span>";

    }


    /* ===============================
       ERROR
    =============================== */

    else if (data.event === "ERROR") {

      console.error(
        "Embedded Signup ERROR:",
        data
      );


      document.getElementById("status").innerHTML =

        '<span class="error">' +

        "WhatsApp Embedded Signup hatası oluştu." +

        "</span>";

    }

  }

  catch (error) {

    /*
      Facebook SDK başka mesajlar da gönderiyor.

      Örneğin:

      cb=...
      domain=...
      code=...

      Bunlar JSON olmadığı için buraya düşebilir.
      Bu normal.
    */

    console.log(
      "Facebook mesajı WA session JSON değildi."
    );

  }

});


/* =====================================================
   FACEBOOK LOGIN CALLBACK
===================================================== */

function fbLoginCallback(response) {

  console.log("LOGIN CALLBACK:", response);


  if (
    response &&
    response.authResponse &&
    response.authResponse.code
  ) {

    authorizationCode =
      response.authResponse.code;


    console.log(
      "Authorization Code başarıyla alındı."
    );

    /*
      CODE'U CONSOLE'A YAZDIRMIYORUZ.

      Bu kod daha sonra backend'e gönderilecek
      ve backend üzerinden Access Token'a
      çevrilecek.

      APP SECRET kesinlikle HTML'e
      konulmayacak.
    */


    document.getElementById("status").innerText =

      "Meta yetkilendirmesi alındı. " +
      "WhatsApp hesap bilgileri bekleniyor...";


    checkIntegrationData();

  }

  else {

    console.error(
      "Authorization Code alınamadı:",
      response
    );


    document.getElementById("status").innerHTML =

      '<span class="error">' +

      "Meta yetkilendirmesi tamamlanamadı." +

      "</span>";

  }

}


/* =====================================================
   TÜM BİLGİLER GELDİ Mİ?
===================================================== */

function checkIntegrationData() {

  console.log("----- INTEGRATION DURUMU -----");

  console.log(
    "Authorization Code:",
    authorizationCode ? "ALINDI" : "BEKLENİYOR"
  );

  console.log(
    "WABA ID:",
    wabaId || "BEKLENİYOR"
  );

  console.log(
    "Phone Number ID:",
    phoneNumberId || "BEKLENİYOR"
  );


  if (
    authorizationCode &&
    wabaId &&
    phoneNumberId
  ) {

    console.log(
      "================================="
    );

    console.log(
      "TÜM WHATSAPP BİLGİLERİ ALINDI"
    );

    console.log(
      "================================="
    );


    document.getElementById("status").innerHTML =

      '<span class="success">' +

      "✓ WhatsApp hesabı başarıyla bağlandı." +

      "<br><br>" +

      "WABA ID: " +
      wabaId +

      "<br>" +

      "Phone Number ID: " +
      phoneNumberId +

      "<br><br>" +

      "Backend bağlantısına hazır." +

      "</span>";

  }

}


/* =====================================================
   EMBEDDED SIGNUP BAŞLAT
===================================================== */

function launchWhatsAppSignup() {

  console.log(
    "Embedded Signup v4 başlatılıyor..."
  );


  document.getElementById("status").innerText =
    "Meta açılıyor...";


  if (typeof FB === "undefined") {

    console.error(
      "Facebook SDK henüz yüklenmedi."
    );


    document.getElementById("status").innerHTML =

      '<span class="error">' +

      "Facebook SDK henüz hazır değil. " +
      "Sayfayı yenileyip tekrar deneyin." +

      "</span>";


    return;

  }


  FB.login(

    fbLoginCallback,

    {

      config_id: CONFIG_ID,

      response_type: "code",

      override_default_response_type: true,

      extras: {
        version: "v4"
      }

    }

  );

}

</script>


<!-- FACEBOOK JAVASCRIPT SDK -->

<script
  async
  defer
  crossorigin="anonymous"
  src="https://connect.facebook.net/en_US/sdk.js">
</script>


</body>
</html>
