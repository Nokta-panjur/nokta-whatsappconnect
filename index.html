<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOKTA WhatsApp Bağlantısı</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
    }

    .card {
      width: 420px;
      padding: 40px;

      border: 1px solid #b88a32;
      border-radius: 18px;

      background: #111;
      text-align: center;
    }

    h1 {
      color: #d4af55;
      letter-spacing: 4px;
    }

    h2 {
      color: #ffffff;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;

      border: 0;
      border-radius: 10px;

      background: #d4af55;
      color: #080808;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>NOKTA</h1>

  <h2>WhatsApp Business</h2>

  <p>
    Nokta WhatsApp Business hesabını
    Nokta Cari sistemine bağla.
  </p>

  <button onclick="launchWhatsAppSignup()">
    WhatsApp Business'ı Bağla
  </button>

  <div id="status">
    Bağlantı bekleniyor.
  </div>

</div>


<script>

  /* ==========================================
     NOKTA META AYARLARI
     ========================================== */

  const APP_ID = "1406505614384928";

  const CONFIG_ID = "1388583019481771";


  /* ==========================================
     FACEBOOK SDK BAŞLAT
     ========================================== */

  window.fbAsyncInit = function() {

    FB.init({
      appId: APP_ID,
      cookie: true,
      xfbml: true,
      version: "v25.0",
      status: false
    });

    console.log("Facebook SDK hazır.");

    document.getElementById("status").innerText =
      "Meta bağlantısı hazır.";
  };


  /* ==========================================
     FACEBOOK SDK YÜKLE
     ========================================== */

  (function(d, s, id) {

    var js;
    var fjs = d.getElementsByTagName(s)[0];

    if (d.getElementById(id)) {
      return;
    }

    js = d.createElement(s);

    js.id = id;

    js.src =
      "https://connect.facebook.net/en_US/sdk.js";

    fjs.parentNode.insertBefore(js, fjs);

  }(
    document,
    "script",
    "facebook-jssdk"
  ));


  /* ==========================================
     WHATSAPP SESSION INFO LISTENER
     ========================================== */

  window.addEventListener(
    "message",
    function(event) {

      if (
        event.origin !== "https://www.facebook.com" &&
        event.origin !== "https://web.facebook.com"
      ) {
        return;
      }


      let data = event.data;


      /* Eğer veri JSON string olarak geldiyse */
      if (typeof data === "string") {

        try {

          data = JSON.parse(data);

        } catch (error) {

          return;

        }

      }


      /* Sadece WhatsApp Embedded Signup
         mesajlarını işle */

      if (
        !data ||
        data.type !== "WA_EMBEDDED_SIGNUP"
      ) {
        return;
      }


      console.log(
        "WhatsApp Embedded Signup:",
        data
      );


      /* ======================================
         BAŞARILI
         ====================================== */

      if (data.event === "FINISH") {

        const phoneNumberId =
          data.data?.phone_number_id || null;

        const wabaId =
          data.data?.waba_id || null;


        console.log(
          "PHONE NUMBER ID:",
          phoneNumberId
        );

        console.log(
          "WABA ID:",
          wabaId
        );


        document.getElementById("status").innerHTML =

          "<strong>WhatsApp bağlantısı tamamlandı.</strong>" +

          "<br><br>" +

          "Phone Number ID: " +
          (phoneNumberId || "-") +

          "<br>" +

          "WABA ID: " +
          (wabaId || "-");

      }


      /* ======================================
         İPTAL
         ====================================== */

      else if (data.event === "CANCEL") {

        console.log(
          "Embedded Signup iptal edildi:",
          data
        );

        document.getElementById("status").innerText =
          "WhatsApp bağlantısı iptal edildi.";

      }


      /* ======================================
         HATA
         ====================================== */

      else if (data.event === "ERROR") {

        console.error(
          "Embedded Signup hatası:",
          data
        );

        document.getElementById("status").innerText =
          "WhatsApp bağlantısında hata oluştu.";

      }

    }
  );


  /* ==========================================
     FACEBOOK LOGIN CALLBACK
     ========================================== */

  function fbLoginCallback(response) {

    console.log(
      "Login response:",
      response
    );


    if (
      response &&
      response.authResponse
    ) {

      const code =
        response.authResponse.code;


      console.log(
        "Authorization Code alındı:",
        code
      );


      document.getElementById("status").innerText =
        "Meta yetkilendirmesi alındı. " +
        "WhatsApp hesap bilgileri bekleniyor...";


      /*
        SONRAKİ AŞAMA:

        Bu authorization code
        backend sunucumuza gönderilecek.

        Backend tarafında Meta API ile
        access token'a çevrilecek.

        APP SECRET kesinlikle
        bu HTML dosyasına yazılmayacak.
      */

    }

    else {

      console.log(
        "Yetkilendirme tamamlanmadı:",
        response
      );

      document.getElementById("status").innerText =
        "Yetkilendirme tamamlanmadı.";

    }

  }


  /* ==========================================
     WHATSAPP EMBEDDED SIGNUP BAŞLAT
     ========================================== */

  function launchWhatsAppSignup() {

    document.getElementById("status").innerText =
      "Meta açılıyor...";


    FB.login(
      fbLoginCallback,
      {

        config_id:
          CONFIG_ID,

        response_type:
          "code",

        override_default_response_type:
          true,

        /*
          META'NIN SENİN CONFIG İÇİN
          VERDİĞİ GÜNCEL AYAR
        */

        extras: {
          "version": "v4"
        }

      }
    );

  }

</script>

</body>
</html>
