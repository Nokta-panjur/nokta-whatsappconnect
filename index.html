<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOKTA WhatsApp Bağlantısı</title>

  <style>
    body {
      margin: 0;
      background: #090909;
      color: #f4f4f4;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 420px;
      max-width: calc(100% - 40px);
      padding: 40px;
      border: 1px solid #b88a32;
      border-radius: 18px;
      background: #111;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: #d4af55;
      letter-spacing: 4px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #d4af55;
      color: #080808;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>NOKTA</h1>
  <h2>WhatsApp Business</h2>

  <p>
    Nokta WhatsApp Business hesabını
    Nokta Cari sistemine bağla.
  </p>

  <button id="connectButton" onclick="launchWhatsAppSignup()">
    WhatsApp Business'ı Bağla
  </button>

  <div id="status">Bağlantı bekleniyor.</div>
</div>

<script>
  const APP_ID = "1406505614384928";
  const CONFIG_ID = "1388583019481771";

  let authorizationCode = null;
  let wabaId = null;
  let phoneNumberId = null;

  function setStatus(message) {
    document.getElementById("status").innerText = message;
  }

  function showResultIfReady() {
    if (authorizationCode && wabaId && phoneNumberId) {
      setStatus("✅ WhatsApp bağlantısı başarıyla tamamlandı.");

      console.log("=== NOKTA WHATSAPP BAĞLANTI SONUCU ===");
      console.log("Authorization Code:", authorizationCode);
      console.log("WABA ID:", wabaId);
      console.log("Phone Number ID:", phoneNumberId);
      console.log("====================================");
    }
  }

  window.fbAsyncInit = function() {
    FB.init({
      appId: APP_ID,
      cookie: true,
      xfbml: true,
      version: "v25.0",
      status: false
    });

    setStatus("Meta bağlantısı hazır.");
  };

  (function(d, s, id) {
    let js;
    const fjs = d.getElementsByTagName(s)[0];

    if (d.getElementById(id)) return;

    js = d.createElement(s);
    js.id = id;
    js.src = "https://connect.facebook.net/en_US/sdk.js";

    fjs.parentNode.insertBefore(js, fjs);
  }(document, "script", "facebook-jssdk"));


  // WhatsApp Embedded Signup eventlerini dinle
  window.addEventListener("message", function(event) {

    if (
      event.origin !== "https://www.facebook.com" &&
      event.origin !== "https://web.facebook.com"
    ) {
      return;
    }

    let data;

    try {
      data = typeof event.data === "string"
        ? JSON.parse(event.data)
        : event.data;
    } catch (e) {
      return;
    }

    if (!data || data.type !== "WA_EMBEDDED_SIGNUP") {
      return;
    }

    console.log("WA_EMBEDDED_SIGNUP EVENT:", data);

    if (data.event === "FINISH") {

      wabaId =
        data.data?.waba_id ||
        data.data?.wabaId ||
        null;

      phoneNumberId =
        data.data?.phone_number_id ||
        data.data?.phoneNumberId ||
        null;

      console.log("WABA ID:", wabaId);
      console.log("Phone Number ID:", phoneNumberId);

      if (wabaId && phoneNumberId) {
        setStatus("WhatsApp hesabı seçildi. Bağlantı tamamlanıyor...");
      } else {
        setStatus("Meta işlemi tamamlandı fakat hesap bilgileri eksik.");
      }

      showResultIfReady();
    }

    else if (data.event === "CANCEL") {
      console.log("Signup iptal edildi:", data);
      setStatus("İşlem iptal edildi.");
    }

    else if (data.event === "ERROR") {
      console.error("Embedded Signup hatası:", data);
      setStatus("WhatsApp bağlantısında Meta hatası oluştu.");
    }

  });


  function launchWhatsAppSignup() {

    if (typeof FB === "undefined") {
      setStatus("Meta SDK henüz yüklenmedi. Birkaç saniye sonra tekrar deneyin.");
      return;
    }

    authorizationCode = null;
    wabaId = null;
    phoneNumberId = null;

    setStatus("Meta açılıyor...");

    FB.login(function(response) {

      console.log("Login response:", response);

      if (
        response &&
        response.authResponse &&
        response.authResponse.code
      ) {

        authorizationCode = response.authResponse.code;

        console.log(
          "Authorization Code alındı:",
          authorizationCode
        );

        setStatus(
          "Meta yetkilendirmesi alındı. WhatsApp hesap bilgileri bekleniyor..."
        );

        showResultIfReady();

      } else {

        console.error(
          "Authorization code alınamadı:",
          response
        );

        setStatus(
          "Meta yetkilendirmesi tamamlanamadı."
        );
      }

    }, {
      config_id: CONFIG_ID,
      response_type: "code",
      override_default_response_type: true,

      extras: {
        setup: {},
        featureType: "whatsapp_business_app_onboarding",
        sessionInfoVersion: "3"
      }
    });
  }
</script>

</body>
</html>
